<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Reviewed Code Modification</title>
<desc id="desc">The modification workflow: instruction and file snapshot go to the LLM, which proposes a replacement. After validation, the user reviews a Diff. Cancel keeps the original. Approve triggers a recheck of the current file state before an undoable write.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
  </marker>
  <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#059669"/>
  </marker>
  <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#dc2626"/>
  </marker>
</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #172b42 }
  .head { font-size: 26px; font-weight: 700 }
  .body { font-size: 20px }
  .small { font-size: 17px; fill: #52657b }
  .label { font-size: 19px; font-weight: 700 }
  .tech { font-size: 16px; fill: #64748b; font-style: italic }
</style>

<!-- Header -->
<text x="40" y="48" class="head" text-anchor="start">Reviewed Code Modification</text>
<text x="1560" y="46" class="small" text-anchor="end">COURSE AI ASSISTANT — F2</text>

<!-- Main flow background -->
<rect x="40" y="90" width="1520" height="770" rx="16" fill="#f5f7fa" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="120" class="small">One Java file per proposal · Generation and preview do not write source files</text>

<!-- Step 1: Input -->
<g transform="translate(80, 150)">
  <rect width="300" height="160" rx="12" fill="#fff2e5" stroke="#ebd1b1" stroke-width="1.5"/>
  <circle cx="30" cy="30" r="18" fill="#d97706"/>
  <text x="30" y="37" class="label" text-anchor="middle" fill="#ffffff">1</text>
  <text x="150" y="60" class="label" text-anchor="middle" fill="#92400e">Instruction + Snapshot</text>
  <text x="30" y="95" class="body">User modification request</text>
  <text x="30" y="122" class="body">Original file snapshot</text>
  <text x="30" y="150" class="small">Full file for accurate Diff</text>
</g>

<!-- Arrow to LLM -->
<path d="M390 230 H460" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- Step 2: LLM proposal -->
<g transform="translate(470, 150)">
  <rect width="280" height="175" rx="12" fill="#eef0ff" stroke="#cdd1f2" stroke-width="2"/>
  <circle cx="30" cy="30" r="18" fill="#4f46e5"/>
  <text x="30" y="37" class="label" text-anchor="middle" fill="#ffffff">2</text>
  <rect x="60" y="12" width="200" height="36" rx="8" fill="#4f46e5"/>
  <text x="160" y="37" class="label" text-anchor="middle" fill="#ffffff">LLM proposal</text>
  <text x="30" y="85" class="body">Target file path</text>
  <text x="30" y="112" class="body">Complete replacement</text>
  <text x="30" y="139" class="body">Explanation</text>
  <text x="30" y="165" class="tech">No file written yet</text>
</g>

<!-- Arrow to validation -->
<path d="M760 230 H830" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- Step 3: Validate -->
<g transform="translate(840, 150)">
  <rect width="260" height="160" rx="12" fill="#e7f5ef" stroke="#b9dfcd" stroke-width="1.5"/>
  <circle cx="30" cy="30" r="18" fill="#059669"/>
  <text x="30" y="37" class="label" text-anchor="middle" fill="#ffffff">3</text>
  <text x="130" y="55" class="label" text-anchor="middle" fill="#065f46">Validate</text>
  <text x="30" y="90" class="body">Target exists?</text>
  <text x="30" y="117" class="body">Replacement valid?</text>
  <text x="30" y="144" class="body">Single file scope?</text>
</g>

<!-- Arrow down to Diff -->
<path d="M970 320 V380" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- Step 4: Diff review -->
<g transform="translate(780, 390)">
  <rect width="380" height="200" rx="12" fill="#e9f0ff" stroke="#c6d6f5" stroke-width="2"/>
  <circle cx="30" cy="30" r="18" fill="#3b82f6"/>
  <text x="30" y="37" class="label" text-anchor="middle" fill="#ffffff">4</text>
  <text x="190" y="50" class="label" text-anchor="middle" fill="#1e40af">Built-in side-by-side Diff</text>
  
  <!-- Diff illustration -->
  <rect x="30" y="75" width="150" height="100" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="105" y="95" class="small" text-anchor="middle" fill="#991b1b">Original</text>
  <line x1="45" y1="110" x2="165" y2="110" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="105" y="130" class="small" text-anchor="middle" fill="#991b1b">- old code</text>
  <text x="105" y="155" class="small" text-anchor="middle" fill="#991b1b">- to remove</text>
  
  <rect x="200" y="75" width="150" height="100" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="275" y="95" class="small" text-anchor="middle" fill="#166534">Proposed</text>
  <line x1="215" y1="110" x2="335" y2="110" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="275" y="130" class="small" text-anchor="middle" fill="#166534">+ new code</text>
  <text x="275" y="155" class="small" text-anchor="middle" fill="#166534">+ to apply</text>
</g>

<!-- Branch point -->
<circle cx="970" cy="640" r="20" fill="#64748b"/>
<text x="970" y="647" class="label" text-anchor="middle" fill="#ffffff">?</text>
<path d="M970 600 V620" fill="none" stroke="#64748b" stroke-width="2.5"/>

<!-- Cancel branch (left) -->
<path d="M950 640 H680" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
<text x="815" y="628" class="label" text-anchor="middle" fill="#dc2626">Cancel</text>

<!-- Cancel result -->
<g transform="translate(420, 610)">
  <rect width="250" height="100" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="125" y="35" class="label" text-anchor="middle" fill="#991b1b">Keep original</text>
  <text x="125" y="65" class="body" text-anchor="middle">Source file unchanged</text>
  <text x="125" y="90" class="small" text-anchor="middle">No write occurred</text>
</g>

<!-- Approve branch (right) -->
<path d="M990 640 H1200" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
<text x="1095" y="628" class="label" text-anchor="middle" fill="#059669">Approve</text>

<!-- Step 5: Recheck -->
<g transform="translate(1210, 590)">
  <rect width="300" height="120" rx="12" fill="#e7f5ef" stroke="#b9dfcd" stroke-width="2"/>
  <circle cx="30" cy="30" r="18" fill="#059669"/>
  <text x="30" y="37" class="label" text-anchor="middle" fill="#ffffff">5</text>
  <text x="150" y="50" class="label" text-anchor="middle" fill="#065f46">Recheck current file</text>
  <text x="30" y="85" class="body">Compare snapshot vs now</text>
  <text x="30" y="110" class="small">Detect intervening edits</text>
</g>

<!-- Arrow to write -->
<path d="M1360 720 V760" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
<text x="1380" y="745" class="small" fill="#059669">matches</text>

<!-- Step 6: Write -->
<g transform="translate(1210, 770)">
  <rect width="300" height="80" rx="12" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <circle cx="30" cy="30" r="18" fill="#ffffff"/>
  <text x="30" y="37" class="label" text-anchor="middle" fill="#059669">6</text>
  <text x="150" y="35" class="label" text-anchor="middle" fill="#ffffff">Undoable write + save</text>
  <text x="150" y="62" class="body" text-anchor="middle" fill="#ffffff">IDE can Undo this change</text>
</g>

<!-- Key constraints section -->
<g transform="translate(80, 350)">
  <rect width="320" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="160" y="30" class="label" text-anchor="middle">Key constraints</text>
  
  <rect x="20" y="50" width="280" height="40" rx="6" fill="#f5f7fa"/>
  <text x="30" y="75" class="body">One Java file per proposal</text>
  
  <rect x="20" y="100" width="280" height="40" rx="6" fill="#f5f7fa"/>
  <text x="30" y="125" class="body">Full file for accurate Diff</text>
  
  <rect x="20" y="150" width="280" height="40" rx="6" fill="#e7f5ef"/>
  <text x="30" y="175" class="body" fill="#065f46">Approve triggers recheck</text>
  
  <text x="160" y="210" class="small" text-anchor="middle">Prevents overwriting edits</text>
</g>

<!-- Comparison note -->
<g transform="translate(80, 590)">
  <rect width="320" height="100" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="160" y="30" class="label" text-anchor="middle" fill="#92400e">Note</text>
  <text x="20" y="55" class="small">Selection context (Q&amp;A) ≠ full file</text>
  <text x="20" y="78" class="small">snapshot (modification). Different</text>
  <text x="20" y="101" class="small">purposes, different granularity.</text>
</g>

<!-- Legend -->
<g transform="translate(1250, 150)">
  <rect width="280" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="28" class="label" text-anchor="middle">Legend</text>
  
  <line x1="20" y1="55" x2="60" y2="55" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="75" y="60" class="small">Normal flow</text>
  
  <line x1="20" y1="85" x2="60" y2="85" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="75" y="90" class="small">Approve path</text>
  
  <line x1="20" y1="115" x2="60" y2="115" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="75" y="120" class="small">Cancel path</text>
  
  <circle cx="30" cy="150" r="12" fill="#64748b"/>
  <text x="30" y="155" class="label" text-anchor="middle" fill="#ffffff" font-size="12">N</text>
  <text x="75" y="155" class="small">Step number</text>
</g>

</svg>
