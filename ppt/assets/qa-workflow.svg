<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Course Q&A Workflow</title>
<desc id="desc">Three inputs converge into the LLM prompt: the question, optional selected code, and retrieved course chunks. The output includes the answer with cited evidence and source locations.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
  </marker>
  <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#3b82f6"/>
  </marker>
</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #172b42 }
  .head { font-size: 26px; font-weight: 700 }
  .body { font-size: 20px }
  .small { font-size: 17px; fill: #52657b }
  .label { font-size: 19px; font-weight: 700 }
  .tech { font-size: 16px; fill: #64748b; font-style: italic }
</style>

<!-- Header -->
<text x="40" y="48" class="head" text-anchor="start">Course Q&amp;A Workflow</text>
<text x="1560" y="46" class="small" text-anchor="end">COURSE AI ASSISTANT</text>

<!-- Input section -->
<rect x="40" y="90" width="600" height="500" rx="16" fill="#f5f7fa" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="125" class="label">Inputs to prompt</text>

<!-- Input 1: Question -->
<g transform="translate(80, 150)">
  <rect width="520" height="100" rx="12" fill="#fff2e5" stroke="#ebd1b1" stroke-width="1.5"/>
  <circle cx="35" cy="50" r="22" fill="#d97706"/>
  <text x="35" y="57" class="label" text-anchor="middle" fill="#ffffff">Q</text>
  <text x="75" y="40" class="label" fill="#92400e">Question</text>
  <text x="75" y="68" class="body">User's course-related question</text>
  <text x="75" y="90" class="small">Always present</text>
</g>

<!-- Input 2: Selected code -->
<g transform="translate(80, 275)">
  <rect width="520" height="100" rx="12" fill="#e9f0ff" stroke="#c6d6f5" stroke-width="1.5"/>
  <circle cx="35" cy="50" r="22" fill="#3b82f6"/>
  <text x="35" y="56" class="label" text-anchor="middle" fill="#ffffff">&lt;/&gt;</text>
  <text x="75" y="40" class="label" fill="#1e40af">Selected code (optional)</text>
  <text x="75" y="68" class="body">Highlighted Java code in editor</text>
  <text x="75" y="90" class="small">Context for code-related questions</text>
</g>

<!-- Input 3: Retrieved chunks -->
<g transform="translate(80, 400)">
  <rect width="520" height="160" rx="12" fill="#e7f5ef" stroke="#b9dfcd" stroke-width="1.5"/>
  <circle cx="35" cy="50" r="22" fill="#059669"/>
  <text x="35" y="57" class="label" text-anchor="middle" fill="#ffffff">R</text>
  <text x="75" y="40" class="label" fill="#065f46">Retrieved course chunks</text>
  <text x="75" y="68" class="body">Up to 5 evidence passages</text>
  <text x="75" y="95" class="small">Each with: document, page/slide, excerpt</text>
  <text x="75" y="120" class="small">Source metadata preserved</text>
  <text x="75" y="148" class="tech">From knowledge retrieval (Slide 5)</text>
</g>

<!-- Convergence arrows -->
<path d="M610 200 C700 200, 700 380, 780 380" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M610 325 C700 325, 700 390, 780 390" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M610 480 C700 480, 700 410, 780 410" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- LLM Processing -->
<g transform="translate(790, 320)">
  <rect width="280" height="160" rx="16" fill="#eef0ff" stroke="#cdd1f2" stroke-width="2"/>
  <rect width="280" height="45" rx="16" fill="#4f46e5"/>
  <rect y="30" width="280" height="15" fill="#4f46e5"/>
  <text x="140" y="30" class="label" text-anchor="middle" fill="#ffffff">Prompt + LLM</text>
  <text x="140" y="75" class="body" text-anchor="middle">OpenAI-compatible</text>
  <text x="140" y="105" class="body" text-anchor="middle">/chat/completions</text>
  <text x="140" y="135" class="tech" text-anchor="middle">Non-streaming</text>
  <text x="140" y="155" class="tech" text-anchor="middle">Single request</text>
</g>

<!-- Output arrow -->
<path d="M1080 400 H1150" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1115" y="388" class="small" text-anchor="middle">response</text>

<!-- Output section -->
<rect x="1160" y="90" width="400" height="500" rx="16" fill="#f5f7fa" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="1180" y="125" class="label">Output</text>

<!-- Output: Answer -->
<g transform="translate(1190, 150)">
  <rect width="340" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect width="340" height="45" rx="12" fill="#10b981"/>
  <rect y="30" width="340" height="15" fill="#10b981"/>
  <text x="170" y="30" class="label" text-anchor="middle" fill="#ffffff">Answer</text>
  <text x="25" y="75" class="body">Generated response</text>
  <text x="25" y="105" class="body">with citation markers [1]</text>
  <text x="25" y="140" class="small">References validated</text>
  <text x="25" y="165" class="small">against supplied IDs</text>
</g>

<!-- Output: Evidence -->
<g transform="translate(1190, 360)">
  <rect width="340" height="200" rx="12" fill="#e7f5ef" stroke="#b9dfcd" stroke-width="1.5"/>
  <text x="170" y="35" class="label" text-anchor="middle" fill="#065f46">Cited evidence</text>
  
  <!-- Evidence item 1 -->
  <rect x="20" y="55" width="300" height="55" rx="8" fill="#ffffff" stroke="#b9dfcd" stroke-width="1"/>
  <text x="35" y="78" class="label" fill="#059669">[1]</text>
  <text x="65" y="78" class="small">document.pdf — page 12</text>
  <text x="65" y="100" class="small">"Original excerpt..."</text>
  
  <!-- Evidence item 2 -->
  <rect x="20" y="120" width="300" height="55" rx="8" fill="#ffffff" stroke="#b9dfcd" stroke-width="1"/>
  <text x="35" y="143" class="label" fill="#059669">[2]</text>
  <text x="65" y="143" class="small">slides.pptx — slide 5</text>
  <text x="65" y="165" class="small">"Original excerpt..."</text>
</g>

<!-- Alternative paths section -->
<rect x="40" y="620" width="1520" height="240" rx="16" fill="#f5f7fa" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="655" class="label">Alternative paths</text>

<!-- No match path -->
<g transform="translate(80, 680)">
  <rect width="440" height="150" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="220" y="35" class="label" text-anchor="middle" fill="#92400e">No relevant match</text>
  <text x="30" y="70" class="body">Retrieval succeeds but no chunks</text>
  <text x="30" y="98" class="body">pass the threshold</text>
  <text x="30" y="130" class="small" fill="#d97706">→ Answer explicitly discloses general knowledge use</text>
</g>

<!-- Retrieval failure path -->
<g transform="translate(560, 680)">
  <rect width="440" height="150" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="220" y="35" class="label" text-anchor="middle" fill="#991b1b">Retrieval failure</text>
  <text x="30" y="70" class="body">Index unavailable or</text>
  <text x="30" y="98" class="body">embedding API error</text>
  <text x="30" y="130" class="small" fill="#dc2626">→ Show error message to user</text>
</g>

<!-- Success indicator -->
<g transform="translate(1040, 680)">
  <rect width="480" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="240" y="35" class="label" text-anchor="middle" fill="#166534">Normal path (most common)</text>
  <text x="30" y="70" class="body">Relevant chunks retrieved</text>
  <text x="30" y="98" class="body">and passed to LLM</text>
  <text x="30" y="130" class="small" fill="#16a34a">→ Answer with cited course evidence</text>
</g>

<!-- Note -->
<text x="80" y="605" class="small">The prompt does not send the entire project or conversation history — only the current question, optional selection, and retrieved evidence.</text>

</svg>
