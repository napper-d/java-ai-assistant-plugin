<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Course AI Assistant — System Architecture</title>
<desc id="desc">IDE integration delegates to project services. Core capabilities include course retrieval, grounded chat, and reviewed single-file changes. Retrieval uses a local index and an embedding endpoint; chat and generation share a chat endpoint. Only approved changes reach project files. Global configuration supports the project services and shared course library.</desc>
